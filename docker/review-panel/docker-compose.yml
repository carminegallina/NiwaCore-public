services:
  review-panel:
    build: .
    container_name: review-panel
    # Host network, like system-panel and companion-panel: the hotspot's
    # firewall refuses new connections from the Docker network into NIWA-AP,
    # where the SELPHY printer lives. Flask still listens on port 5052.
    network_mode: host
    volumes:
      - /mnt/niwa-storage:/storage
      - /home/niwa/niwa/data:/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
